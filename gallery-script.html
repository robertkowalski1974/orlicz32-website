<script>
// Gallery Lightbox Script
var currentIndex = 0;
var galleryImages = [
  'images/gallery/cozy-retreat/01-living.jpg',
  'images/gallery/cozy-retreat/02-bedroom.jpg',
  'images/gallery/cozy-retreat/03-kitchen.jpg',
  'images/gallery/cozy-retreat/04-detail.jpg',
  'images/gallery/cozy-retreat/05-view.jpg',
  'images/gallery/cozy-retreat/06-room.jpg',
  'images/gallery/cozy-retreat/07-bathroom.jpg',
  'images/gallery/cozy-retreat/08-interior.jpg',
  'images/gallery/cozy-retreat/09-space.jpg',
  'images/gallery/cozy-retreat/10-amenity.jpg',
  'images/gallery/cozy-retreat/11-area.jpg',
  'images/gallery/cozy-retreat/12-corner.jpg',
  'images/gallery/cozy-retreat/13-feature.jpg',
  'images/gallery/cozy-retreat/14-extra.jpg',
  'images/gallery/cozy-retreat/15-final.jpg'
];
var totalImages = galleryImages.length;

function openLightbox(index) {
  currentIndex = index;
  document.getElementById('lightbox-img').src = galleryImages[currentIndex];
  document.getElementById('lightbox-current').textContent = currentIndex + 1;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function changeSlide(direction) {
  currentIndex += direction;
  if (currentIndex >= totalImages) currentIndex = 0;
  if (currentIndex < 0) currentIndex = totalImages - 1;
  document.getElementById('lightbox-img').src = galleryImages[currentIndex];
  document.getElementById('lightbox-current').textContent = currentIndex + 1;
}

document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') changeSlide(1);
  if (e.key === 'ArrowLeft') changeSlide(-1);
});
</script>
