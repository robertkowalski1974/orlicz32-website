project:
  type: website
  resources:
    - lightbox.js
    - robots.txt
    - sitemap.xml
    - llms.txt
    - llms-full.txt
    - CNAME
  output-dir: docs
  post-render:
    - cp sitemap.xml docs/

website:
  title: "Apartamenty Orlicz 32"
  description: "Boutique apartments in the heart of Zamość - UNESCO World Heritage City"
  favicon: images/favicon.svg
  
  navbar:
    background: "#2D2926"
    foreground: "#FFFFFF"
    logo: images/logo.webp
    logo-alt: "Apartamenty Orlicz 32"
    title: false
    left:
      - text: "Home"
        href: index.qmd
      - text: "Apartments"
        href: apartments.qmd
      - text: "Zamość"
        href: zamosc.qmd
      - text: "Gallery"
        href: gallery.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - text: "Book Now"
        href: book.qmd
      - text: "PL"
        href: pl/index.qmd
  
  page-footer:
    background: "#2D2926"
    foreground: "#C9A961"
    center: |
      <div class="footer-content">
        <div class="footer-logo">ORLICZ 32</div>
        <div class="footer-tagline">"Feel like home while you are away"</div>
        <div class="footer-address">Orlicz-Dreszera 32, 22-400 Zamość, Poland</div>
        <div class="footer-copyright">© 2025 Apartamenty Orlicz 32. All rights reserved.</div>
      </div>

format:
  html:
    theme:
      - cosmo
      - custom.scss
    css: styles.css
    lightbox: true
    toc: false
    page-layout: full
    include-in-header:
