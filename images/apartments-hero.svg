  <text x="960" y="520" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#FFFFFF" opacity="0.8">Contemporary comfort meets timeless elegance</text>
  
  <text x="960" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#C9A961" opacity="0.5">REPLACE WITH APARTMENT INTERIOR PHOTO</text>
