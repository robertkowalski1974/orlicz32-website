    <line x1="200" y1="400" x2="350" y2="400" stroke="#C9A961" stroke-width="1"/>
    
    <rect x="1570" y="250" width="150" height="250" rx="5" fill="none" stroke="#C9A961" stroke-width="2"/>
    <line x1="1645" y1="250" x2="1645" y2="500" stroke="#C9A961" stroke-width="1"/>
    <line x1="1570" y1="375" x2="1720" y2="375" stroke="#C9A961" stroke-width="1"/>
  </g>
  
  <!-- Central content -->
  <text x="960" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="8" fill="#C9A961">APARTAMENTY ORLICZ 32</text>
  
  <line x1="760" y1="370" x2="910" y2="370" stroke="#C9A961" stroke-width="1"/>
  <rect x="920" y="363" width="10" height="10" fill="#C9A961" transform="rotate(45 925 368)"/>
