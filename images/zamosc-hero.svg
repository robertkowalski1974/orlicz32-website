<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800">
  <defs>
    <linearGradient id="zamoscGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2926;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3D3936;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#zamoscGrad)"/>
  
  <!-- Simplified Renaissance architecture silhouette -->
  <g opacity="0.15" stroke="#C9A961" fill="none" stroke-width="1.5">
    <!-- Town Hall tower silhouette -->
    <rect x="910" y="200" width="100" height="300"/>
    <polygon points="910,200 960,120 1010,200"/>
    <rect x="930" y="230" width="20" height="40"/>
    <rect x="970" y="230" width="20" height="40"/>
    <rect x="940" y="300" width="40" height="60"/>
    
    <!-- Arcaded buildings left -->
    <rect x="500" y="350" width="400" height="150"/>
    <g transform="translate(500, 350)">
      <path d="M20,0 L20,100 A30,30 0 0,1 80,100 L80,0" />
      <path d="M100,0 L100,100 A30,30 0 0,1 160,100 L160,0" />
      <path d="M180,0 L180,100 A30,30 0 0,1 240,100 L240,0" />
      <path d="M260,0 L260,100 A30,30 0 0,1 320,100 L320,0" />
      <path d="M340,0 L340,100 A30,30 0 0,1 400,100 L400,0" />
    </g>
    
    <!-- Arcaded buildings right -->
    <rect x="1020" y="350" width="400" height="150"/>
    <g transform="translate(1020, 350)">
      <path d="M0,0 L0,100 A30,30 0 0,1 60,100 L60,0" />
      <path d="M80,0 L80,100 A30,30 0 0,1 140,100 L140,0" />
      <path d="M160,0 L160,100 A30,30 0 0,1 220,100 L220,0" />
      <path d="M240,0 L240,100 A30,30 0 0,1 300,100 L300,0" />
      <path d="M320,0 L320,100 A30,30 0 0,1 380,100 L380,0" />
    </g>
  </g>
  
  <!-- Central content -->
  <text x="960" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="6" fill="#C9A961">DISCOVER</text>
  
  <line x1="760" y1="370" x2="910" y2="370" stroke="#C9A961" stroke-width="1"/>
  <rect x="920" y="363" width="10" height="10" fill="#C9A961" transform="rotate(45 925 368)"/>
  <rect x="990" y="363" width="10" height="10" fill="#C9A961" transform="rotate(45 995 368)"/>
  <line x1="1010" y1="370" x2="1160" y2="370" stroke="#C9A961" stroke-width="1"/>
  
  <text x="960" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#FFFFFF">Zamość</text>
  
  <text x="960" y="520" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#FFFFFF" opacity="0.8">Pearl of the Renaissance • UNESCO World Heritage Site</text>
  
  <text x="960" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#C9A961" opacity="0.5">REPLACE WITH GREAT MARKET SQUARE PHOTO</text>
</svg>
