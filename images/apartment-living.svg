<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="livingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F2ED;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8E4DD;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#livingGrad)"/>
  
  <!-- Living room sketch -->
  <g stroke="#2D2926" fill="none" stroke-width="1" opacity="0.3">
    <!-- Sofa -->
    <rect x="100" y="350" width="300" height="120" rx="10"/>
    <rect x="100" y="320" width="300" height="35" rx="5"/>
    <rect x="110" y="355" width="80" height="110" rx="5"/>
    <rect x="310" y="355" width="80" height="110" rx="5"/>
    
    <!-- Coffee table -->
    <rect x="150" y="500" width="200" height="60" rx="3"/>
    
    <!-- Window -->
    <rect x="500" y="100" width="200" height="300" rx="3"/>
    <line x1="600" y1="100" x2="600" y2="400"/>
    <line x1="500" y1="250" x2="700" y2="250"/>
    
    <!-- Plant -->
    <ellipse cx="650" y="480" rx="40" ry="30"/>
    <rect x="640" y="500" width="20" height="60"/>
  </g>
  
  <rect x="300" y="260" width="200" height="80" fill="#2D2926" rx="5"/>
  <text x="400" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#C9A961">Living Space</text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Add apartment photo</text>
</svg>
