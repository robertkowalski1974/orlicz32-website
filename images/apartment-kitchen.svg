<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="kitchenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F2ED;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8E4DD;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#kitchenGrad)"/>
  
  <!-- Kitchen sketch -->
  <g stroke="#2D2926" fill="none" stroke-width="1" opacity="0.3">
    <!-- Counter -->
    <rect x="100" y="300" width="600" height="200"/>
    <line x1="100" y1="350" x2="700" y2="350"/>
    
    <!-- Upper cabinets -->
    <rect x="100" y="100" width="200" height="150"/>
    <rect x="320" y="100" width="160" height="150"/>
    <rect x="500" y="100" width="200" height="150"/>
    
    <!-- Range hood -->
    <path d="M350,250 L350,280 L530,280 L530,250"/>
    
    <!-- Sink -->
    <ellipse cx="600" y="400" rx="50" ry="25"/>
    
    <!-- Stove -->
    <rect x="380" y="360" width="100" height="80"/>
    <circle cx="410" cy="390" r="15"/>
    <circle cx="450" cy="390" r="15"/>
    <circle cx="410" cy="420" r="15"/>
    <circle cx="450" cy="420" r="15"/>
  </g>
  
  <rect x="300" y="260" width="200" height="80" fill="#2D2926" rx="5"/>
  <text x="400" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#C9A961">Kitchen</text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Add apartment photo</text>
</svg>
