<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2926;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#3D3936;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2D2926;stop-opacity:1"/>
    </linearGradient>
    <pattern id="artDeco" patternUnits="userSpaceOnUse" width="100" height="100">
      <path d="M50 0 L100 50 L50 100 L0 50 Z" fill="none" stroke="#C9A961" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#heroGrad)"/>
  <rect width="100%" height="100%" fill="url(#artDeco)"/>
  
  <!-- Central Art Deco frame -->
  <rect x="660" y="340" width="600" height="400" fill="none" stroke="#C9A961" stroke-width="2"/>
  <rect x="670" y="350" width="580" height="380" fill="none" stroke="#C9A961" stroke-width="1" opacity="0.5"/>
  
  <!-- Corner decorations -->
  <path d="M660 340 L630 340 L630 310" fill="none" stroke="#C9A961" stroke-width="2"/>
  <path d="M1260 340 L1290 340 L1290 310" fill="none" stroke="#C9A961" stroke-width="2"/>
  <path d="M660 740 L630 740 L630 770" fill="none" stroke="#C9A961" stroke-width="2"/>
  <path d="M1260 740 L1290 740 L1290 770" fill="none" stroke="#C9A961" stroke-width="2"/>
  
  <!-- Logo text -->
  <text x="960" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="10" fill="#C9A961">APARTAMENTY</text>
  
