  <line x1="760" y1="500" x2="880" y2="500" stroke="#C9A961" stroke-width="2"/>
  <rect x="895" y="493" width="14" height="14" fill="#C9A961" transform="rotate(45 902 500)"/>
  <line x1="925" y1="500" x2="1045" y2="500" stroke="#C9A961" stroke-width="2"/>
  <rect x="1055" y="493" width="14" height="14" fill="#C9A961" transform="rotate(45 1062 500)"/>
  <line x1="1075" y1="500" x2="1160" y2="500" stroke="#C9A961" stroke-width="2"/>
  
  <!-- Main title -->
  <text x="960" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#FFFFFF">ORLICZ 32</text>
  
  <!-- Bottom lines -->
  <line x1="760" y1="600" x2="880" y2="600" stroke="#C9A961" stroke-width="2"/>
  <rect x="895" y="593" width="14" height="14" fill="#C9A961" transform="rotate(45 902 600)"/>
  <line x1="925" y1="600" x2="1045" y2="600" stroke="#C9A961" stroke-width="2"/>
  <rect x="1055" y="593" width="14" height="14" fill="#C9A961" transform="rotate(45 1062 600)"/>
  <line x1="1075" y1="600" x2="1160" y2="600" stroke="#C9A961" stroke-width="2"/>
  
  <!-- Tagline -->
  <text x="960" y="680" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#FFFFFF" opacity="0.9">"Feel like home while you are away"</text>
  
  <!-- Placeholder text -->
  <text x="960" y="900" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="#C9A961" opacity="0.6">REPLACE WITH APARTMENT INTERIOR PHOTO</text>
